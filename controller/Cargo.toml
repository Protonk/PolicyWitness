[package]
name = "controller"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "policy-witness"
path = "src/main.rs"

[[bin]]
name = "sandbox-log-observer"
path = "src/bin/sandbox-log-observer.rs"

[[bin]]
name = "sbpl-check"
path = "src/bin/sbpl-check.rs"

[[test]]
name = "cli_contract"
path = "integration/cli_contract.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = "3"
